name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Run repository checks and Herdr unit tests
        run: >-
          nix develop --command bash -lc '
          ./scripts/testing/onboarding-smoke.sh --strict-shellcheck &&
          python3 -m unittest discover -s home-manager/modules/herdr
          '

      - name: Build flake checks (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: nix flake check --option sandbox relaxed
